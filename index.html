<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content">
    <meta name="color-scheme" content="dark">
    <title>SocialConnect - Connexion</title>
<link rel="icon" type="image/svg+xml" href="socialconnect-icon.svg">
<link rel="apple-touch-icon" href="socialconnect-icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B3D2E">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body { min-height: 100vh; min-height: 100dvh; }

        body {
            background-color: #0b141a;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            padding-top: max(60px, 12vh);
            overflow-x: hidden;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }

        button:focus-visible, input:focus-visible {
            outline: 2px solid #00a884;
            outline-offset: 2px;
        }

        .auth-container { width: 100%; max-width: 400px; text-align: center; }

        .logo-container {
            width: 90px;
            height: 90px;
            background-color: #00a884;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px auto;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .logo-container svg { width: 45px; height: 45px; fill: white; }

        .auth-card {
            background: #111b21;
            padding: 30px 25px;
            border-radius: 16px;
            border: 1px solid #222e35;
        }

        h2 { color: #e9edef; margin-bottom: 12px; font-size: 26px; font-weight: bold; }

        .subtitle {
            color: #00a884;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #8696a0;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            padding: 14px 16px;
            background-color: #2a3942;
            border: 1px solid #2a3942;
            border-radius: 8px;
            font-size: 16px;
            color: #e9edef;
            outline: none;
            transition: border-color 0.2s;
            letter-spacing: 1px;
        }

        .phone-input-row { display: flex; gap: 8px; }
        .phone-input-row input { flex: 1; min-width: 0; }

        .country-select {
            flex-grow: 0;
            flex-shrink: 0;
            flex-basis: 100px;
            width: 100px;
            min-width: 100px;
            max-width: 100px;
            padding: 14px 22px 14px 8px;
            background-color: #2a3942;
            border: 1px solid #2a3942;
            border-radius: 8px;
            font-size: 14px;
            color: #e9edef;
            outline: none;
            transition: border-color 0.2s;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238696a0'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 4px center;
            background-size: 16px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }

        .country-select:focus { border-color: #00a884; }

        .input-group input:focus { border-color: #00a884; }
        .input-group input.invalid { border-color: #f87171; }

        .field-error {
            color: #f87171;
            font-size: 13px;
            margin-top: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #00a884;
            color: #111b21;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary {
            background-color: transparent;
            color: #8696a0;
            margin-top: 15px;
            font-size: 14px;
            text-decoration: underline;
            border-radius: 0;
        }

        .btn-secondary:disabled { text-decoration: none; opacity: 0.6; }

        .hidden { display: none !important; }

        /* Masque le formulaire tant que l'état de connexion n'est pas connu (évite un flash) */
        .auth-container.checking { visibility: hidden; }

        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(4px); }
            30%, 50%, 70% { transform: translateX(-8px); }
            40%, 60% { transform: translateX(8px); }
        }

        .shake { animation: shake 0.4s; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: #202c33;
            color: #e9edef;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 10000;
            max-width: 85vw;
            text-align: center;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="auth-container checking" id="auth-container">
        <div class="logo-container">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
        </div>

        <div id="phone-screen" class="auth-card">
            <h2>SocialConnect</h2>
            <p class="subtitle">Connectez-vous de manière sécurisée grâce à votre numéro de téléphone.</p>
            <form id="phone-form" novalidate>
                <div class="input-group">
                    <label for="phone-number">Numéro de téléphone</label>
                    <div class="phone-input-row">
                        <select id="country-code" class="country-select" aria-label="Indicatif du pays">
                            <option value="+261" data-trunk="0" data-min="9" data-placeholder="34 12 345 67" selected>🇲🇬 +261</option>
                            <option value="+269" data-min="7" data-placeholder="321 23 45">🇰🇲 +269</option>
                            <option value="+33" data-trunk="0" data-min="9" data-placeholder="6 12 34 56 78">🇫🇷 +33</option>
                            <option value="+230" data-min="7" data-placeholder="5712 3456">🇲🇺 +230</option>
                            <option value="+262" data-trunk="0" data-min="9" data-placeholder="692 12 34 56">🇷🇪 +262</option>
                        </select>
                        <input type="tel" id="phone-number" inputmode="tel" autocomplete="tel" placeholder="34 12 345 67" autofocus>
                    </div>
                    <p class="field-error" id="phone-error" hidden>Entre un numéro valide pour ce pays.</p>
                </div>
                <div id="recaptcha-container"></div>
                <button type="submit" id="phone-submit-btn">Continuer</button>
            </form>
        </div>

        <div id="otp-screen" class="auth-card hidden">
            <h2>Vérification</h2>
            <p class="subtitle" id="otp-subtitle">Entre le code reçu par SMS.</p>

            <form id="otp-form" novalidate>
                <div class="input-group">
                    <label for="otp-code">Code de vérification</label>
                    <input type="text" id="otp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="• • • • • •">
                    <p class="field-error" id="otp-error" hidden>Code incorrect, réessaie.</p>
                </div>
                <button type="submit" id="otp-submit-btn">Vérifier le numéro</button>
            </form>
            <button type="button" id="btn-resend" class="btn-secondary" disabled>Renvoyer le code (60s)</button>
            <button type="button" id="btn-back" class="btn-secondary">Modifier le numéro</button>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            RecaptchaVerifier,
            signInWithPhoneNumber
        } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPcjWWpj4Oy_thZVcPP1i-WlVXMHW6EvA",
            authDomain: "socialconnect-ea2ac.firebaseapp.com",
            projectId: "socialconnect-ea2ac",
            storageBucket: "socialconnect-ea2ac.firebasestorage.app",
            messagingSenderId: "715050033217",
            appId: "1:715050033217:web:dc86dd1d9a6caaa9b9a6c0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        auth.languageCode = 'fr';
        const db = getFirestore(app);

        let recaptchaVerifier = null;
        let confirmation = null;
        let verifying = false;   // true pendant la confirmation du code : évite une redirection avant l'écriture dans l'annuaire
        let redirecting = false;

        function goHome() {
            if (redirecting) return;
            redirecting = true;
            window.location.replace('accueil.html');
        }

        // ============ GARDE DE SESSION (basée sur Firebase Auth) ============
        // Si l'utilisateur est déjà connecté (rechargement, bouton retour, bfcache…),
        // on l'envoie directement vers l'accueil. Sinon on affiche le formulaire.
        onAuthStateChanged(auth, (user) => {
            if (user && !verifying) { goHome(); return; }
            if (!user) document.getElementById('auth-container').classList.remove('checking');
        });
        window.addEventListener('pageshow', (e) => {
            if (e.persisted && auth.currentUser && !verifying) goHome();
        });

        // ============ reCAPTCHA invisible (exigé par Firebase pour l'envoi de SMS) ============
        function resetRecaptcha() {
            if (recaptchaVerifier) {
                try { recaptchaVerifier.clear(); } catch (e) { /* ignore */ }
                recaptchaVerifier = null;
            }
            const container = document.getElementById('recaptcha-container');
            if (container) container.innerHTML = '';
        }

        function ensureRecaptcha() {
            if (!recaptchaVerifier) {
                recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
            }
            return recaptchaVerifier;
        }

        // Envoie un vrai SMS via Firebase. fullNumber doit être au format E.164 (ex : +261341234567).
        window.sendVerificationCode = async function (fullNumber) {
            try {
                confirmation = await signInWithPhoneNumber(auth, fullNumber, ensureRecaptcha());
                return { ok: true };
            } catch (e) {
                console.warn('Envoi du SMS impossible :', e);
                resetRecaptcha();
                return { ok: false, code: (e && e.code) || 'unknown' };
            }
        };

        // Vérifie le code côté Firebase. En cas de succès : enregistre le numéro dans l'annuaire
        // (document users/{numéro}) puis redirige vers l'accueil.
        window.confirmVerificationCode = async function (code) {
            if (!confirmation) return { ok: false, code: 'no-confirmation' };
            verifying = true;
            try {
                const cred = await confirmation.confirm(code);
                const user = cred.user;
                try {
                    await setDoc(doc(db, 'users', user.phoneNumber), {
                        phone: user.phoneNumber,
                        uid: user.uid,
                        lastLoginAt: serverTimestamp()
                    }, { merge: true });
                } catch (e) {
                    console.warn("Impossible d'enregistrer le numéro dans l'annuaire :", e);
                }
                goHome();
                return { ok: true };
            } catch (e) {
                verifying = false;
                return { ok: false, code: (e && e.code) || 'unknown' };
            }
        };
    </script>

    <script>
        const phoneScreen = document.getElementById('phone-screen');
        const otpScreen = document.getElementById('otp-screen');
        const phoneForm = document.getElementById('phone-form');
        const otpForm = document.getElementById('otp-form');
        const countrySelect = document.getElementById('country-code');
        const phoneNumberInput = document.getElementById('phone-number');
        const otpCodeInput = document.getElementById('otp-code');
        const btnBack = document.getElementById('btn-back');
        const btnResend = document.getElementById('btn-resend');
        const phoneError = document.getElementById('phone-error');
        const otpError = document.getElementById('otp-error');
        const otpSubtitle = document.getElementById('otp-subtitle');
        const otpSubmitBtn = document.getElementById('otp-submit-btn');
        const phoneSubmitBtn = document.getElementById('phone-submit-btn');
        const authContainer = document.getElementById('auth-container');

        let pendingFullNumber = '';
        let resendTimer = null;
        let toastTimer = null;

        // Filet de sécurité : si Firebase ne charge pas (réseau, CDN bloqué), on affiche quand même le formulaire.
        setTimeout(() => authContainer.classList.remove('checking'), 4000);

        function getSelectedCountry() {
            const opt = countrySelect.options[countrySelect.selectedIndex];
            return {
                dial: opt.value,
                minDigits: parseInt(opt.dataset.min, 10),
                placeholder: opt.dataset.placeholder,
                trunkZero: opt.dataset.trunk === '0'
            };
        }

        countrySelect.addEventListener('change', () => {
            const country = getSelectedCountry();
            phoneNumberInput.placeholder = country.placeholder;
            phoneError.hidden = true;
            phoneNumberInput.classList.remove('invalid');
        });
        phoneNumberInput.placeholder = getSelectedCountry().placeholder;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
        }

        function onlyDigits(value) {
            return value.replace(/\D/g, '');
        }

        // Convertit la saisie en numéro E.164. Dans certains pays (Madagascar, France, Réunion),
        // on écrit un « 0 » devant le numéro en local (034…) : il ne fait pas partie du format international.
        function buildE164(country, rawValue) {
            let digits = onlyDigits(rawValue);
            if (country.trunkZero && digits.startsWith('0')) digits = digits.slice(1);
            return { digits, full: `${country.dial}${digits}` };
        }

        function authErrorMessage(code) {
            switch (code) {
                case 'auth/invalid-phone-number': return 'Numéro invalide pour ce pays.';
                case 'auth/missing-phone-number': return 'Entre ton numéro de téléphone.';
                case 'auth/too-many-requests': return 'Trop de tentatives. Réessaie dans quelques minutes.';
                case 'auth/quota-exceeded': return "Quota de SMS dépassé. Réessaie plus tard.";
                case 'auth/billing-not-enabled': return "L'envoi de SMS réels n'est pas activé sur ce projet Firebase (plan Blaze requis).";
                case 'auth/operation-not-allowed': return "La connexion par téléphone n'est pas activée dans Firebase.";
                case 'auth/unauthorized-domain': return "Ce domaine n'est pas autorisé dans Firebase (Authentication > Paramètres > Domaines autorisés).";
                case 'auth/captcha-check-failed': return 'Vérification anti-robot échouée. Recharge la page.';
                case 'auth/network-request-failed': return 'Pas de connexion. Vérifie ton réseau.';
                case 'auth/invalid-verification-code': return 'Code incorrect, réessaie.';
                case 'auth/code-expired': return 'Code expiré. Demande un nouveau code.';
                case 'auth/missing-verification-code': return 'Entre le code reçu par SMS.';
                case 'no-confirmation': return 'Session expirée. Redemande un code.';
                default: return `Erreur inattendue (${code}).`;
            }
        }

        function startResendCountdown() {
            let seconds = 60;
            btnResend.disabled = true;
            btnResend.textContent = `Renvoyer le code (${seconds}s)`;
            clearInterval(resendTimer);
            resendTimer = setInterval(() => {
                seconds--;
                if (seconds <= 0) {
                    clearInterval(resendTimer);
                    btnResend.disabled = false;
                    btnResend.textContent = 'Renvoyer le code';
                } else {
                    btnResend.textContent = `Renvoyer le code (${seconds}s)`;
                }
            }, 1000);
        }

        function showPhoneError(message) {
            phoneError.textContent = message;
            phoneError.hidden = false;
            phoneNumberInput.classList.add('invalid');
        }

        phoneForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            if (phoneSubmitBtn.disabled) return;
            const country = getSelectedCountry();
            const { digits, full } = buildE164(country, phoneNumberInput.value);

            if (digits.length < country.minDigits || digits.length > 12) {
                showPhoneError('Entre un numéro valide pour ce pays.');
                phoneNumberInput.focus();
                return;
            }
            if (!window.sendVerificationCode) {
                showPhoneError('Service de connexion indisponible. Vérifie ta connexion et recharge la page.');
                return;
            }
            phoneError.hidden = true;
            phoneNumberInput.classList.remove('invalid');
            phoneNumberInput.blur();
            window.scrollTo(0, 0);

            phoneSubmitBtn.disabled = true;
            phoneSubmitBtn.textContent = 'Envoi du SMS…';
            const result = await window.sendVerificationCode(full);
            phoneSubmitBtn.disabled = false;
            phoneSubmitBtn.textContent = 'Continuer';

            if (!result.ok) {
                showPhoneError(authErrorMessage(result.code));
                return;
            }

            pendingFullNumber = full;
            otpCodeInput.value = '';
            otpCodeInput.classList.remove('invalid');
            otpError.hidden = true;
            otpSubmitBtn.disabled = false;
            otpSubtitle.textContent = `Entre le code envoyé par SMS au ${country.dial} ${digits}`;

            phoneScreen.classList.add('hidden');
            otpScreen.classList.remove('hidden');
            startResendCountdown();
            showToast('SMS envoyé');
            setTimeout(() => otpCodeInput.focus(), 300);
        });

        otpCodeInput.addEventListener('input', () => {
            otpCodeInput.value = onlyDigits(otpCodeInput.value).slice(0, 6);
            otpError.hidden = true;
            otpCodeInput.classList.remove('invalid');
        });

        function showOtpError(message) {
            otpError.textContent = message;
            otpError.hidden = false;
            otpCodeInput.classList.add('invalid');
            otpScreen.classList.add('shake');
            setTimeout(() => otpScreen.classList.remove('shake'), 400);
            otpCodeInput.focus();
            otpCodeInput.select();
        }

        otpForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            if (otpSubmitBtn.disabled) return;
            if (otpCodeInput.value.length !== 6) {
                showOtpError('Le code contient 6 chiffres.');
                return;
            }
            if (!window.confirmVerificationCode) {
                showOtpError('Service de connexion indisponible. Recharge la page.');
                return;
            }

            otpSubmitBtn.disabled = true;
            otpSubmitBtn.textContent = 'Vérification…';
            const result = await window.confirmVerificationCode(otpCodeInput.value);

            if (!result.ok) {
                otpSubmitBtn.disabled = false;
                otpSubmitBtn.textContent = 'Vérifier le numéro';
                showOtpError(authErrorMessage(result.code));
                return;
            }

            // Succès : la page redirige vers l'accueil (déclenchée côté module après l'écriture dans l'annuaire).
            clearInterval(resendTimer);
            showToast('Numéro vérifié — bienvenue !');
        });

        btnBack.addEventListener('click', () => {
            clearInterval(resendTimer);
            otpScreen.classList.add('hidden');
            phoneScreen.classList.remove('hidden');
            phoneNumberInput.focus();
        });

        btnResend.addEventListener('click', async () => {
            if (btnResend.disabled || !pendingFullNumber) return;
            otpCodeInput.blur();
            btnResend.disabled = true;
            btnResend.textContent = 'Envoi…';
            const result = await window.sendVerificationCode(pendingFullNumber);
            if (!result.ok) {
                btnResend.disabled = false;
                btnResend.textContent = 'Renvoyer le code';
                showOtpError(authErrorMessage(result.code));
                return;
            }
            otpCodeInput.value = '';
            otpCodeInput.classList.remove('invalid');
            otpError.hidden = true;
            showToast('Nouveau SMS envoyé');
            startResendCountdown();
            setTimeout(() => otpCodeInput.focus(), 300);
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
